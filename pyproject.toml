[project]
name = "tennis-platform"
version = "0.1.0"
description = "End-to-end tennis data platform: ingestion, lakehouse (Databricks + dbt), Elo ratings, match prediction and Grand Slam simulation."
readme = "README.md"
license = "MIT"
authors = [
    { name = "borgarro", email = "borgarro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "duckdb>=1.5.5",
    "ipykernel>=7.3.0",
    "pandas>=3.0.6",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

# --- Linting & formatting -------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names...)
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (likely bugs)
    "UP",  # pyupgrade (modern Python syntax)
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Exploratory notebooks embed long SQL strings that read better unwrapped
"notebooks/*.ipynb" = ["E501"]

# --- Tests ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
